version: '3.8'

services:
  mongo:
    image: mongo:4.4.18 # Specify a stable version
    container_name: xray_vpn_bot_mongo
    restart: unless-stopped
    ports:
      - "0.0.0.0:27017:27017" # Bind to localhost only for security
    volumes:
      - mongo_data:/data/db # Persist MongoDB data
    environment:
      TZ: Etc/UTC # Consistent timezone
      # Закомментировать эти строки для отключения аутентификации:
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    healthcheck:
      test: ["CMD", "mongo", "localhost:27017/test", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xray_vpn_bot_app
    restart: unless-stopped
    depends_on:
      mongo: # Wait for mongo to be healthy
        condition: service_healthy
    ports:
      # Expose only if needed externally, otherwise keep internal
      - "127.0.0.1:8080:8080" # Bind to localhost
    environment:
      # --- General --- #
      ENV: ${ENV:-local} # Default to local if ENV not set
      CONFIG_PATH: /app/configs/docker.yaml # Use a docker-specific config
      TZ: Etc/UTC

      # --- Database --- #
      # Изменить строку подключения - удалить учетные данные:
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-xray_vpn_bot_docker}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-xray_vpn_bot_docker}

      # --- Telegram --- #
      # Secrets MUST come from host environment or a secrets management system
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-0}
      TELEGRAM_PROVIDER_TOKEN: ${TELEGRAM_PROVIDER_TOKEN}

      # --- YooKassa --- #
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      # Set appropriate URLs based on your deployment
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:8080/payment/return}
      YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET:-}

      # --- XUI --- #
      XUI_ADDRESS: ${XUI_ADDRESS}
      XUI_USERNAME: ${XUI_USERNAME}
      XUI_PASSWORD: ${XUI_PASSWORD}
      XUI_API_TIMEOUT: ${XUI_API_TIMEOUT:-15s}

    volumes:
      # Mount a specific docker config file
      - ./configs/docker.yaml:/app/configs/docker.yaml:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo_data:
    driver: local # Explicitly define volume driver

networks:
  default:
    driver: bridge
    name: xray_vpn_bot_network