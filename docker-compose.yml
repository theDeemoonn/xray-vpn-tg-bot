version: '3.8'

services:
  mongo:
    image: mongo:6.0 # Specify a stable version
    container_name: xray_vpn_bot_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017" # Bind to localhost only for security
    volumes:
      - mongo_data:/data/db # Persist MongoDB data
    environment:
      TZ: Etc/UTC # Consistent timezone
      # For production, uncomment and set strong passwords:
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # MONGO_INITDB_DATABASE: ${MONGO_DB_NAME} # Optionally create the app DB
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xray_vpn_bot_app
    restart: unless-stopped
    depends_on:
      mongo: # Wait for mongo to be healthy
        condition: service_healthy
    ports:
      # Expose only if needed externally, otherwise keep internal
      - "127.0.0.1:8080:8080" # Bind to localhost
    environment:
      # --- General --- #
      ENV: ${ENV:-local} # Default to local if ENV not set
      CONFIG_PATH: /app/configs/docker.yaml # Use a docker-specific config
      TZ: Etc/UTC

      # --- Database --- #
      # Use internal service name 'mongo'. Credentials from host env.
      MONGO_URI: mongodb://${MONGO_USER:-user}:${MONGO_PASSWORD:-password}@mongo:27017/${MONGO_DB_NAME:-xray_vpn_bot_docker}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-xray_vpn_bot_docker}

      # --- Telegram --- #
      # Secrets MUST come from host environment or a secrets management system
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-0} 

      # --- YooKassa --- #
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      # Set appropriate URLs based on your deployment
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:8080/payment/return} 
      YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET:-}

      # --- XUI --- #
      # XUI_API_TIMEOUT: 15s 

    volumes:
      # Mount a specific docker config file
      - ./configs/docker.yaml:/app/configs/docker.yaml:ro
      # DO NOT mount .env file directly in production. Pass vars through docker-compose `environment`.
      # For local development, mounting .env can be convenient IF godotenv is used:
      # - ./.env:/app/.env:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo_data:
    driver: local # Explicitly define volume driver

# Define a default network (optional, but good practice)
networks:
  default:
    driver: bridge
    name: xray_vpn_bot_network

# Networks (optional, docker-compose creates a default network)
# networks:
#   default:
#     driver: bridge 